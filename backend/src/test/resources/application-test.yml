spring:
  datasource:
    # H2 in PostgreSQL compatibility mode, so the tests exercise (close to) the real dialect.
    url: jdbc:h2:mem:kanban;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: validate # schema comes from Flyway (see below), same as in production
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  mail:
    host: "" # keeps EmailService in log-only mode — no real SMTP in tests

app:
  jwt:
    secret: test-secret-that-is-definitely-long-enough-for-hmac-sha256
    expiration-ms: 3600000
    refresh-expiration-ms: 3600000
  security:
    # Most integration tests register-then-immediately-log-in; a dedicated test covers
    # the enforced-verification path explicitly with this flag overridden back to true.
    require-email-verification: false
  rate-limit:
    # High enough that the broad integration test suite (many registrations/logins
    # sharing one IP) never trips it; RateLimitTest overrides these to prove the feature.
    login:
      max-attempts: 1000
      window-seconds: 60
    register:
      max-attempts: 1000
      window-seconds: 60
    password-reset:
      max-attempts: 1000
      window-seconds: 60
