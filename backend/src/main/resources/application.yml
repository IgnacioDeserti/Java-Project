spring:
  application:
    name: kanban-board
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:kanban}
    username: ${DB_USER:kanban}
    password: ${DB_PASSWORD:kanban}
  jpa:
    hibernate:
      ddl-auto: validate # schema is owned by Flyway migrations; Hibernate only checks it matches
    open-in-view: false # controllers return DTOs, so no lazy loading during serialization
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: ${SERVER_PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET:change-this-secret-in-production-please-make-it-long}
    expiration-ms: ${JWT_EXPIRATION_MS:900000} # 15 min — short-lived access token
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:2592000000} # 30 days
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
  mail:
    host: ${MAIL_HOST:}
    from: ${MAIL_FROM:no-reply@example.com}
  base-url: ${APP_BASE_URL:http://localhost:5173}
  security:
    require-email-verification: ${REQUIRE_EMAIL_VERIFICATION:true}
  rate-limit:
    login:
      max-attempts: ${RATE_LIMIT_LOGIN_MAX:10}
      window-seconds: ${RATE_LIMIT_LOGIN_WINDOW_SECONDS:60}
    register:
      max-attempts: ${RATE_LIMIT_REGISTER_MAX:5}
      window-seconds: ${RATE_LIMIT_REGISTER_WINDOW_SECONDS:600}
    password-reset:
      max-attempts: ${RATE_LIMIT_PASSWORD_RESET_MAX:5}
      window-seconds: ${RATE_LIMIT_PASSWORD_RESET_WINDOW_SECONDS:600}

management:
  endpoints:
    web:
      exposure:
        include: health
  health:
    # No SMTP configured is a valid, fully-supported state (EmailService falls back to
    # logging) — without this, /actuator/health reports DOWN whenever mail isn't set up.
    mail:
      enabled: false
